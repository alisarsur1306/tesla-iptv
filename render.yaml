services:
  - type: web
    name: tesla-iptv
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: XTREAM_SERVER
        sync: false
      - key: XTREAM_USERNAME
        sync: false
      - key: XTREAM_PASSWORD
        sync: false
      - key: ACCESS_KEY
        sync: false
      # Cloudflare Worker that reaches the Xtream host (blocked for Render's IP).
      # See cloudflare-worker/README.md. Leave unset to talk to upstream directly
      # (works locally / from a residential IP; fails from Render).
      - key: XTREAM_PROXY_URL
        sync: false
      - key: XTREAM_PROXY_TOKEN
        sync: false
